<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Status</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            color: #1d428a;
        }

        .header p {
            margin-bottom: 0;
            color: #666;
        }

        .back-btn {
            background: #555;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .summary-card h2 {
            margin: 5px 0;
            color: #2563eb;
            font-size: 30px;
        }

        .summary-card p {
            margin: 0;
            color: #666;
        }

        .payment-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .payment-section h2 {
            color: #1d428a;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #1d428a;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8fafc;
        }

        .paid {
            background: #dcfce7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .failed {
            background: #fee2e2;
            color: #991b1b;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <div>
                <h1>💳 Payment Status</h1>
                <p>View customer payment details</p>
            </div>

            <button
                class="back-btn"
                onclick="window.location.href='seller-dashboard.html'">
                ← Back to Dashboard
            </button>

        </div>


        <!-- Summary -->
        <div class="summary">

            <div class="summary-card">

                <p>Total Payments</p>

                <h2 id="totalPayments">
                    0
                </h2>

            </div>


            <div class="summary-card">

                <p>Successful Payments</p>

                <h2 id="successfulPayments">
                    0
                </h2>

            </div>


            <div class="summary-card">

                <p>Total Amount</p>

                <h2>
                    ₹<span id="totalAmount">0.00</span>
                </h2>

            </div>

        </div>


        <!-- Payment Table -->
        <div class="payment-section">

            <h2>📋 Payment Transactions</h2>

            <div id="loading" class="loading">
                Loading payment details...
            </div>

            <table id="paymentTable" style="display:none;">

                <thead>

                    <tr>
                        <th>Payment ID</th>
                        <th>Order ID</th>
                        <th>Amount</th>
                        <th>Payment Method</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="paymentBody">
                </tbody>

            </table>

            <div
                id="noData"
                class="no-data"
                style="display:none;">

                No payment transactions found.

            </div>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // ==========================================
        // SUPABASE CONNECTION
        // ==========================================

        const SUPABASE_URL =
            "https://djiqsudsnlxnzxqtsbar.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Yo9-JloHznmsQbavqb4EEw_wq3DavvS";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==========================================
        // LOAD PAYMENTS
        // ==========================================

        async function loadPayments() {

            const loading =
                document.getElementById("loading");

            const table =
                document.getElementById("paymentTable");

            const noData =
                document.getElementById("noData");


            const {
                data,
                error
            } = await supabaseClient
                .from("payments")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                console.error(
                    "Payment loading error:",
                    error
                );

                loading.style.display = "none";

                noData.style.display = "block";

                noData.innerHTML =
                    "❌ Unable to load payment details.";

                return;
            }


            loading.style.display = "none";


            // No payments
            if (!data || data.length === 0) {

                noData.style.display = "block";

                return;
            }


            table.style.display = "table";


            const paymentBody =
                document.getElementById("paymentBody");


            let totalAmount = 0;

            let successfulPayments = 0;


            paymentBody.innerHTML = "";


            data.forEach(payment => {

                const row =
                    document.createElement("tr");


                const status =
                    payment.payment_status || "Pending";


                const statusClass =
                    status.toLowerCase() === "paid"
                        ? "paid"
                        : status.toLowerCase() === "failed"
                            ? "failed"
                            : "pending";


                const amount =
                    Number(payment.amount || 0);


                totalAmount += amount;


                if (
                    status.toLowerCase() === "paid"
                ) {

                    successfulPayments++;

                }


                row.innerHTML = `

                    <td>
                        ${payment.payment_id || "-"}
                    </td>

                    <td>
                        #${payment.order_id || "-"}
                    </td>

                    <td>
                        ₹${amount.toFixed(2)}
                    </td>

                    <td>
                        ${payment.payment_method || "-"}
                    </td>

                    <td>
                        <span class="${statusClass}">
                            ${status}
                        </span>
                    </td>

                `;


                paymentBody.appendChild(row);

            });


            // Update summary

            document.getElementById(
                "totalPayments"
            ).textContent = data.length;


            document.getElementById(
                "successfulPayments"
            ).textContent = successfulPayments;


            document.getElementById(
                "totalAmount"
            ).textContent =
                totalAmount.toFixed(2);

        }


        // ==========================================
        // START
        // ==========================================

        loadPayments();

    </script>

</body>

</html>
