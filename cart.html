<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #cartList {
            max-width: 800px;
            margin: 30px auto;
        }

        .cart-card {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .cart-card h3 {
            margin-top: 0;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .remove-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }

        #totalBox {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: right;
        }

        #totalAmount {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        #placeOrderBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }
        .quantity button:disabled {
    background: #999;
    cursor: not-allowed;
}
    </style>
</head>

<body>

<h1>🛒 My Cart</h1>

<div id="cartList">
    Loading cart...
</div>

<div id="totalBox">
    <p>
        Total:
        <span id="totalAmount">₹0</span>
    </p>

    <button id="placeOrderBtn" onclick="placeOrder()">
        🛍️ Place Order
    </button>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://djiqsudsnlxnzxqtsbar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Yo9-JloHznmsQbavqb4EEw_wq3DavvS";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let cartItems = [];


// ==============================
// LOAD CART
// ==============================
async function loadCart() {

    const cartList = document.getElementById("cartList");

    try {

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError) {
            throw userError;
        }

        if (!user) {
            window.location.href = "customer-login.html";
            return;
        }

        // Get cart items
        const { data: cartData, error: cartError } =
            await supabaseClient
                .from("cart_items")
                .select("id, product_id, quantity")
                .eq("customer_id", user.id);

        if (cartError) {
            throw cartError;
        }

        if (!cartData || cartData.length === 0) {

            cartItems = [];

            cartList.innerHTML =
                "<h3 style='text-align:center;'>Your cart is empty 🛒</h3>";

            document.getElementById("totalAmount").textContent = "₹0";

            return;
        }

        // Get product IDs
        const productIds = cartData.map(item => item.product_id);

        // Get products
        const { data: productsData, error: productsError } =
            await supabaseClient
                .from("products")
                .select("id, name, price, image_url, stock")
                .in("id", productIds);

        if (productsError) {
            throw productsError;
        }

        // Combine cart items with products
        cartItems = cartData.map(item => {

            const product = productsData.find(
                p => String(p.id) === String(item.product_id)
            );

            return {
                ...item,
                products: product
            };
        });

        // Check missing product
        cartItems = cartItems.filter(item => item.products);

        displayCart();

    } catch (error) {

        console.error("Cart Error:", error);

        cartList.innerHTML =
            `<p style="color:red;text-align:center;">
                ${error.message}
            </p>`;
    }
}

// ==============================
// DISPLAY CART
// ==============================

function displayCart() {

    const container =
        document.getElementById("cartList");

    container.innerHTML = "";

    if (cartItems.length === 0) {

        container.innerHTML =
            "<h3 style='text-align:center;'>Your cart is empty 🛒</h3>";

        document.getElementById("totalAmount")
            .textContent = "₹0";

        return;
    }


    let total = 0;


    cartItems.forEach(item => {

        const product = item.products;

        const price =
            Number(product.price);

        const quantity =
            Number(item.quantity);
            const stock =
    Number(product.stock);

        const itemTotal =
            price * quantity;

        total += itemTotal;


        const div =
            document.createElement("div");

        div.className = "cart-card";


        div.innerHTML = `
            <img
                src="${product.image_url}"
                alt="${product.name}"
                style="width:120px;height:120px;object-fit:contain;"
            >

            <h3>${product.name}</h3>

            <p class="price">
                ₹${price}
            </p>
            <p>
    Available Stock:
    <strong>${stock}</strong>
</p>

            <div class="quantity">

    <button
        type="button"
        onclick="changeQuantity('${item.id}', ${quantity - 1})">
        −
    </button>

    <strong>${quantity}</strong>

    <button
        type="button"
        onclick="changeQuantity('${item.id}', ${quantity + 1})"
        ${quantity >= stock ? "disabled" : ""}>
        +
    </button>

</div>

            <p>
                Item Total:
                <strong>₹${itemTotal}</strong>
            </p>

            <button
                class="remove-btn"
                onclick="removeItem('${item.id}')">
                🗑️ Remove
            </button>
        `;


        container.appendChild(div);

    });


    document.getElementById("totalAmount")
        .textContent = "₹" + total;
}


// ==============================
// CHANGE QUANTITY
// ==============================

async function changeQuantity(id, quantity) {

    const item = cartItems.find(
        item => String(item.id) === String(id)
    );

    if (!item) return;

    const stock = Number(item.products.stock);

    // Cannot exceed available stock
    if (quantity > stock) {
        alert("Only " + stock + " items available in stock.");
        return;
    }

    if (quantity < 1) {
        await removeItem(id);
        return;
    }

    const { error } = await supabaseClient
        .from("cart_items")
        .update({
            quantity: quantity
        })
        .eq("id", id);

    if (error) {
        alert(error.message);
        return;
    }

    loadCart();
}

// ==============================
// REMOVE ITEM
// ==============================

async function removeItem(id) {

    const { error } =
        await supabaseClient
            .from("cart_items")
            .delete()
            .eq("id", id);


    if (error) {
        alert(error.message);
        return;
    }


    loadCart();
}


// ==============================
// PLACE ORDER
// ==============================

async function placeOrder() {

    if (cartItems.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
        alert("Please login first.");
        window.location.href = "customer-login.html";
        return;
    }

    let total = 0;

    cartItems.forEach(item => {
        total += Number(item.products.price) * Number(item.quantity);
    });

    const { data: order, error: orderError } =
        await supabaseClient
            .from("orders")
            .insert({
                customer_id: user.id,
                total_amount: total,
                status: "Pending"
            })
            .select()
            .single();

    if (orderError) {
        alert("Order error: " + orderError.message);
        return;
    }

    const orderItems = cartItems.map(item => ({
        order_id: order.id,
        product_id: item.product_id,
        quantity: item.quantity,
        price: Number(item.products.price)
    }));

    const { error: itemError } =
        await supabaseClient
            .from("order_items")
            .insert(orderItems);

    if (itemError) {
        alert("Order items error: " + itemError.message);
        return;
    }

    const { error: cartError } =
        await supabaseClient
            .from("cart_items")
            .delete()
            .eq("customer_id", user.id);

    if (cartError) {
        alert("Cart clear error: " + cartError.message);
        return;
    }

    alert("Order placed successfully! 📦");

    window.location.href = "payment.html?order_id=" + order.id;
}


// ==============================

loadCart();

</script>

</body>
</html>
