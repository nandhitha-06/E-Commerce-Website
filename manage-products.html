<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            color: #1d428a;
        }

        .back-btn {
            border: none;
            background: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #333;
        }

        #productList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            border-radius: 10px;
            background: #f8f8f8;
        }

        .card h3 {
            margin: 15px 0 8px;
            color: #222;
        }

        .price {
            color: green;
            font-size: 19px;
            font-weight: bold;
        }

        .description {
            color: #555;
            line-height: 1.5;
        }

        .stock {
            font-weight: bold;
            margin: 10px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            opacity: 0.85;
        }

        .message {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 40px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📦 Manage Products</h1>

        <button class="back-btn" onclick="goBack()">
            ← Back to Dashboard
        </button>
    </div>

    <div id="productList">
        <div class="message">Loading products...</div>
    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://djiqsudsnlxnzxqtsbar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Yo9-JloHznmsQbavqb4EEw_wq3DavvS";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ===============================
// LOAD PRODUCTS
// ===============================

async function loadProducts() {

    const container =
        document.getElementById("productList");

    container.innerHTML =
        '<div class="message">Loading products...</div>';


    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .order("id", { ascending: false });


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="message">
                ❌ Error loading products
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="message">
                📦 No products found.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "card";


        card.innerHTML = `

            <img
                src="${product.image_url || ''}"
                alt="${product.name}"
            >

            <h3>
                ${product.name || "Unnamed Product"}
            </h3>

            <div class="price">
                ₹${product.price || 0}
            </div>

            <p class="description">
                ${product.description || "No description available."}
            </p>

            <div class="stock">
                📦 Stock:
                ${product.stock ?? "Not available"}
            </div>

            <div class="buttons">

                <button
                    class="edit-btn"
                    onclick="editProduct('${product.id}')">
                    ✏️ Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct('${product.id}')">
                    🗑️ Delete
                </button>

            </div>
        `;


        container.appendChild(card);

    });

}


// ===============================
// DELETE PRODUCT
// ===============================

async function deleteProduct(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "✅ Product deleted successfully!"
    );


    loadProducts();

}


// ===============================
// EDIT PRODUCT
// ===============================

async function editProduct(id) {

    const newName =
        prompt("Enter product name:");

    if (newName === null) {
        return;
    }


    const newPrice =
        prompt("Enter product price:");

    if (newPrice === null) {
        return;
    }


    const newDescription =
        prompt("Enter product description:");

    if (newDescription === null) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("products")
            .update({

                name: newName,

                price: newPrice,

                description: newDescription

            })
            .eq("id", id);


    if (error) {

        alert(
            "❌ Update failed:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "✅ Product updated successfully!"
    );


    loadProducts();

}


// ===============================
// BACK TO DASHBOARD
// ===============================

function goBack() {

    window.location.href =
        "seller-dashboard.html";

}


// ===============================
// START
// ===============================

loadProducts();

</script>

</body>
</html>
